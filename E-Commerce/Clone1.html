<!DOCTYPE html>
<html>
<head>
    <title>Amazon Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        .navbar {
            background-color: #131921;
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: orange;
        }

        .search-box input {
            padding: 7px;
            width: 300px;
            border: none;
        }

        .search-box button {
            padding: 7px;
            background-color: orange;
            border: none;
            cursor: pointer;
        }

        .nav-links span {
            margin-left: 15px;
            cursor: pointer;
        }

        /* HERO SECTION */
        .hero {
            background: url("https://images.unsplash.com/photo-1607082349566-187342175e2f") no-repeat center;
            background-size: cover;
            height: 300px;
        }

        /* PRODUCTS */
        .products {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 15px;
            margin: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card button {
            background-color: orange;
            border: none;
            padding: 8px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* FOOTER */
        .footer {
            background-color: #131921;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        body {
            background-color: #eaeded;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">Amazon</div>

        <div class="search-box">
            <input type="text" placeholder="Search products">
            <button>Search</button>
        </div>

        <div class="nav-links">
            <span>Sign In</span>
            <span>Returns</span>
            <span>Cart 🛒</span>
        </div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero"></div>

    <!-- PRODUCTS -->
    <div class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
            <h3>Smartphone</h3>
            <p>$499</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1526178613658-3f1622045557">
            <h3>Headphones</h3>
            <p>$99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
            <h3>Laptop</h3>
            <p>$899</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12">
            <h3>Smart Watch</h3>
            <p>$199</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Amazon Clone | Made by You 🚀
    </div>

</body>
</html>
